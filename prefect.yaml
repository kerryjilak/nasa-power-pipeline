# How Prefect Cloud gets and runs this project's code.
name: nasa-power-pipeline

# Before every run, Prefect clones the repository and moves into src/,
# so that `import my_pipeline` works.
pull:
  - prefect.deployments.steps.git_clone:
      id: clone
      repository: https://github.com/kerryjilak/nasa-power-pipeline.git
      branch: main
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone.directory }}/src"

deployments:
  - name: hello
    entrypoint: nasa_power_pipeline/hello.py:hello_pipeline
    parameters:
      name: Prefect Cloud
    work_pool:
      name: my-managed-pool
    schedules:
       - cron: "0 9 * * 1-5"
         timezone: Africa/Accra

  - name: daily
    entrypoint: nasa_power_pipeline/plan_ske.py:nasa_power_plan
    parameters:
      name: Prefect Cloud
    work_pool:
      name: my-managed-pool